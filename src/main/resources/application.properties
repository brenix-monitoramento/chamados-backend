# Nome da aplicação
spring.application.name=chamados

# Configuração do Banco de Dados PostgreSQL
# O Spring tentará ler SPRING_DATASOURCE_URL. Se não achar, usará localhost:5432
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pefil ativo
spring.profiles.active=${PROFILE_ACTIVE:test}

# Chave secreta JWT
jwt.secret=${JWT_SECRET:chave-aleatoria-lorem-ipsum-dolor-sit-amet}

# Swagger especificação e UI
springdoc.api-docs.enabled=${SWAGGER_SPECIFICATION_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}